name: XT.COM API rate limits
limits:
- name: Gateway IP flow limit
  scope: ip
  limit_text: per-interface, stated on each endpoint as N/s/ip (e.g. 100/s/ip)
- name: Gateway apiKey flow limit
  scope: apiKey
  limit_text: per-interface, stated on each endpoint as N/s/apiKey (e.g. 50/s/apiKey)
