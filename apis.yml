aid: xt-com
name: XT.COM
image: https://a.static-global.com/home_seo/en.jpg
description: XT.COM is a centralized cryptocurrency exchange offering spot, margin, USDT-M and coin-M futures, copy trading,
  earn and loan products. Its developer program at doc.xt.com documents REST and WebSocket APIs on sapi.xt.com (spot) and
  fapi.xt.com (futures), publishes OpenAPI 3.0 contracts for the futures market-data and user APIs in github.com/XtApis/xt-api,
  an official Python connector (pyxt), and a local MCP server with agent skills (XT TradeKit).
