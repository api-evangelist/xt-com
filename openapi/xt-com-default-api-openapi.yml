openapi: 3.2.0
info:
  title: Xt Com 合约信息 API
  version: '1.0'
  contact: {}
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0
  termsOfService: urn:tos
  description: 'Operations tagged 合约信息 across 4 of this provider''s published API definitions: xt-com-biz-quotation.yml, xt-com-biz-user.yml, xt-com-futures-market-openapi.yml, xt-com-futures-user-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://fapi.xt.com
  description: Inferred Url
tags:
- name: 合约信息
  description: Contract Info Controller
paths:
  /v1/public/contract/open-interest:
    get:
      tags:
      - 合约信息
      summary: 获取交易对仓位头寸
      operationId: getOpenInterestUsingGET
      parameters:
      - name: client-ip
        in: header
        description: client-ip
        required: false
        schema:
          type: string
      - name: symbol
        in: query
        description: symbol
        required: true
        style: form
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CommonResponse_OpenInterestVO'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
    servers:
    - url: https://fapi.xt.com
      description: Inferred Url
  /v1/public/contract/risk-balance:
    get:
      tags:
      - 合约信息
      summary: 获取交易对风险基金余额
      operationId: getRiskBalanceListUsingGET
      parameters:
      - name: client-ip
        in: header
        description: client-ip
        required: false
        schema:
          type: string
      - name: direction
        in: query
        description: 方向（PREV:上一页；NEXT:下一页）
        required: false
        style: form
        allowReserved: false
        schema:
          type: string
      - name: id
        in: query
        description: id
        required: false
        style: form
        allowReserved: false
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: 条数
        required: false
        style: form
        allowReserved: false
        schema:
          type: integer
          format: int32
      - name: symbol
        in: query
        description: 交易对
        required: true
        style: form
        allowReserved: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CommonResponse_MongoPageResult_RiskBalanceVO'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
    servers:
    - url: https://fapi.xt.com
      description: Inferred Url
