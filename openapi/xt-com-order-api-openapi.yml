  description: 'Operations tagged 合约聪明钱-order across 2 of this provider''s published API definitions: xt-com-biz-user.yml, xt-com-futures-user-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://fapi.xt.com
  description: Inferred Url
tags:
- name: 合约聪明钱-order
  description: Smart Money Order Controller
paths:
  /v1/smartMoney/public/list-history:
    get:
      tags:
      - 合约聪明钱-order
      summary: 查询历史仓位
      operationId: listHistoryUsingGET
      parameters:
      - name: accountId
        in: query
        description: 账户id
        required: false
        style: form
        schema:
          type: integer
          format: int64
      - name: direction
        in: query
        description: 方向,default:NEXT:下一页;PREVIOUS:上一页
        required: false
        style: form
        schema:
          type: string
      - name: endTime
        in: query
        description: 结束时间
        required: false
        style: form
        schema:
          type: integer
          format: int64
      - name: id
        in: query
        description: id,排序ID，用于翻页
        required: false
        style: form
        schema:
          type: integer
          format: int64
      - name: isFullClose
        in: query
        description: 仓位模式：0部分平仓 1全部平仓 不传查询全部
        required: false
        style: form
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: 每页显示数量,default=10
        required: false
        style: form
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        description: 页码
        required: false
        style: form
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: positionType
        in: query
        description: 仓位模式：1全仓、2逐仓 不传查询全部
        required: false
        style: form
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        description: 单页数
        required: false
        style: form
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
      - name: startTime
        in: query
        description: 起始时间
        required: false
        style: form
        schema:
          type: integer
          format: int64
      - name: symbol
        in: query
        description: 交易对
        required: false
        style: form
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CommonResponse_PageResult_SMPositionHistoryVO'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
    servers:
    - url: https://fapi.xt.com
      description: Inferred Url
  /v1/smartMoney/public/list/active:
