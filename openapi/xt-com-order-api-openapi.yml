components:
  schemas:
    PageResult_OrderTradeVO:
      title: PageResult«OrderTradeVO»
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderTradeVO'
        page:
          type: integer
          format: int64
        ps:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    CommonResponse_PageResult_OrderTradeVO:
      title: CommonResponse«PageResult«OrderTradeVO»»
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorMessage'
        msgInfo:
          type: string
        result:
          $ref: '#/components/schemas/PageResult_OrderTradeVO'
        returnCode:
          type: integer
          format: int32
    SMPositionVO:
      title: SMPositionVO
      type: object
      properties:
        accountId:
          type: string
        autoMargin:
          type: boolean
          description: 是否自动追加保证金
          example: false
        availableCloseSize:
          type: number
          description: 可平仓数量（张）
          format: bigdecimal
        closeOrderSize:
          type: number
          description: 平仓挂单数量（张）
          format: bigdecimal
        closeProfit:
          type: number
          description: 平仓盈亏
          format: bigdecimal
        contractSize:
          type: number
          description: 合约面值
          format: bigdecimal
        contractType:
          type: string
          description: 合约类型：PERPETUAL(永续合约)、PREDICT(预测合约)
        entryPrice:
          type: number
          description: 开仓均价
          format: bigdecimal
        isolatedMargin:
          type: number
          description: 逐仓保证金
          format: bigdecimal
        leverage:
          type: integer
          description: 杠杆倍数
          format: int32
        markPrice:
          type: number
          description: 标记价
          format: bigdecimal
        openOrderMarginFrozen:
          type: number
          description: 开仓订单保证金占用
          format: bigdecimal
        openOrderSize:
          type: number
          description: 开仓订单占用
          format: bigdecimal
        positionSide:
          type: string
          description: 持仓方向
        positionSize:
          type: number
          description: 持仓数量（张）
          format: bigdecimal
        positionType:
          type: string
          description: 仓位类型:CROSSED(全仓);ISOLATED(逐仓)
        profitFixedCount:
          type: integer
          description: 部分仓位止盈止损总数
          format: int32
        profitFixedLatest:
          description: 最新设置的部分仓位止盈止损
          $ref: '#/components/schemas/ProfitFixedLatest'
        profitId:
          type: integer
          description: 止盈止损id
          format: int64
        realizedProfit:
          type: number
          description: 已实现盈亏
          format: bigdecimal
        reverseEntrustId:
          type: integer
          description: 反手委托id
          format: int64
        reverseStopPrice:
          type: number
          description: 反手触发价格
          format: bigdecimal
        reverseTriggerPriceType:
          type: string
          description: 反手触发价格类型
        symbol:
          type: string
          description: 交易对
        totalFee:
          type: number
          description: 手续费
          format: bigdecimal
        totalFundFee:
          type: number
          description: 资金费用
          format: bigdecimal
        triggerPriceType:
          type: string
          description: 触发价格类型 1、指数价格 2：标记价格（合理价格）；3：最新价',
        triggerProfitPrice:
          type: number
          description: 止盈触发价
          format: bigdecimal
        triggerStopPrice:
          type: number
          description: 止损触发价
          format: bigdecimal
        updatedTime:
          type: integer
          description: 更新时间
          format: int64
        welfareAccount:
          type: boolean
        welfareExpirationTime:
          type: integer
          description: 赠金券到期时间
          format: int64
    CommonResponse_PageResult_SMPositionHistoryVO:
      title: CommonResponse«PageResult«SMPositionHistoryVO»»
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorMessage'
        msgInfo:
          type: string
        result:
          $ref: '#/components/schemas/PageResult_SMPositionHistoryVO'
        returnCode:
          type: integer
          format: int32
    ProfitFixedLatest:
      title: ProfitFixedLatest
      type: object
      properties:
        profitId:
          type: integer
          description: 止盈止损id
          format: int64
        triggerPriceType:
          type: string
          description: 触发价格类型 1、指数价格 2：标记价格（合理价格）；3：最新价',
        triggerProfitPrice:
          type: number
          description: 止盈触发价
          format: bigdecimal
        triggerStopPrice:
          type: number
          description: 止损触发价
          format: bigdecimal
    OrderTradeVO:
      title: OrderTradeVO
      type: object
      properties:
        amount:
          type: number
          description: 成交金额
          format: bigdecimal
        baseCoin:
          type: string
          description: baseCoin
        bonusDeductFee:
          type: number
          description: 手续费-体验金抵扣金额
          format: bigdecimal
        contractSize:
          type: number
          description: 合约面值
          format: bigdecimal
        contractType:
          type: integer
          description: "合约类型，永续，交割     PERPETUAL(1, \"perpetual\"),\n    CURRENT_MONTH(2, \"current month\"),\n    NEXT_MONTH(3, \"next month\"),\n    CURRENT_QUARTER(4, \"current quarter\"),\n    NEXT_QUARTER(5, \"next quarter\"),\n    PREDICT(6, \"predict\"),\n    CURRENT_WEEK(7, \"next quarter\"),\n    NEXT_WEEK(8, \"next quarter\");"
          format: int32
        couponDeductFee:
          type: number
          description: 手续费-抵扣金券抵扣金额
          format: bigdecimal
        execId:
          type: integer
          description: 成交id
          format: int64
        fee:
          type: number
          description: 手续费
          format: bigdecimal
        feeCoin:
          type: string
          description: 手续费币种
        orderId:
          type: integer
          description: 订单id
          format: int64
        orderSide:
          type: string
          description: 买卖方向：BUY;SELL
        positionSide:
          type: string
          description: 仓位方向：LONG;SHORT
        price:
          type: number
          description: 成交价格
          format: bigdecimal
        quantity:
          type: number
          description: 成交数量
          format: bigdecimal
        symbol:
          type: string
          description: 交易对
        takerMaker:
          type: string
          enum:
          - MAKER
          - TAKER
        timestamp:
          type: integer
          description: 时间
          format: int64
        underlyingType:
          type: integer
          description: 标的类型，1:币本位合约；2:USDT本位合约(采用后台默认)
          format: int32
    PageResult_SMPositionHistoryVO:
      title: PageResult«SMPositionHistoryVO»
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SMPositionHistoryVO'
        page:
          type: integer
          format: int64
        ps:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    SMPositionHistoryVO:
      title: SMPositionHistoryVO
      type: object
      properties:
        closeOpenPrice:
          type: number
          description: 已平仓的开仓均价
          format: bigdecimal
        closePositionSize:
          type: number
          description: 平仓量
          format: bigdecimal
        closePrice:
          type: number
          description: 平仓均价
          format: bigdecimal
        closeProfit:
          type: number
          description: 已实现盈亏
          format: bigdecimal
        closeTime:
          type: integer
          description: 平仓时间
          format: int64
        contractType:
          type: string
          description: 合约类型：PERPETUAL(永续合约)、PREDICT(预测合约)
        endLeverage:
          type: integer
          description: 平仓杠杠
          format: int32
        force:
          type: boolean
          description: 是否是强平仓位历史，true-是，false-不是
          example: false
        forceMarkPrice:
          type: number
          format: bigdecimal
        id:
          type: integer
          format: int64
        maxPositionSize:
          type: number
          description: 最大持仓量
          format: bigdecimal
        openTime:
          type: integer
          description: 开仓时间
          format: int64
        positionSide:
          type: string
          description: 持仓方向,LONG 多，SHORT 空
        positionType:
          type: string
          description: 仓位类型:CROSSED(全仓);ISOLATED(逐仓)
        startLeverage:
          type: integer
          description: 起始杠杠
          format: int32
        symbol:
          type: string
          description: 交易对
        totalFee:
          type: number
          description: 手续费
          format: bigdecimal
        totalFundFee:
          type: number
          description: 资金费率
          format: bigdecimal
        welfareAccount:
          type: boolean
          description: 赠金标识符
          example: false
        working:
          type: boolean
    ErrorMessage:
      title: ErrorMessage
      type: object
      properties:
        args:
          type: array
          items:
            type: object
        code:
          type: string
        msg:
          type: string
    CommonResponse_PageResult_SMPositionVO:
      title: CommonResponse«PageResult«SMPositionVO»»
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorMessage'
        msgInfo:
          type: string
        result:
          $ref: '#/components/schemas/PageResult_SMPositionVO'
        returnCode:
          type: integer
          format: int32
    PageResult_SMPositionVO:
      title: PageResult«SMPositionVO»
      type: object
